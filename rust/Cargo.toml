[package]
name = "rust_lib_rustle"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
log = { version = "0.4", features = ["max_level_info", "release_max_level_warn"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Nur für Android
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Nur für Linux Desktop
[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
zbus = "4.0"
futures-lite = "2.3"
bluer = { version = "0.17", features = ["full"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

# Nur für Windows (später)
#[target.'cfg(target_windows)'.dependencies]
